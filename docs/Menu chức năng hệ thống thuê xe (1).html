<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu chức năng hệ thống thuê xe</title>
<style>
:root{--bg:#f6f7fb;--sf:#fff;--tx:#1b2033;--mu:#667089;--bd:#e3e6ef;--ac:#2563eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11141d;--sf:#1a1f2c;--tx:#eef0f7;--mu:#98a1b8;--bd:#2a3042;--ac:#6ea0ff}}
:root[data-theme="dark"]{--bg:#11141d;--sf:#1a1f2c;--tx:#eef0f7;--mu:#98a1b8;--bd:#2a3042;--ac:#6ea0ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
header{padding:20px 24px 12px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{font-size:22px;margin:0}
h1 small{display:block;font-size:13px;font-weight:400;color:var(--mu)}
.roles{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.wrap{display:flex;gap:16px;padding:0 24px 32px;align-items:flex-start}
nav{width:250px;flex-shrink:0;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:8px;position:sticky;top:8px}
nav button{width:100%;text-align:left;display:flex;gap:10px;align-items:center;border:0;background:none;color:var(--tx);padding:10px 12px;border-radius:10px;font-size:15px;cursor:pointer}
nav button:hover{background:var(--bg)}
nav button.on{background:var(--gc);color:#fff}
nav .n{margin-left:auto;font-size:12px;opacity:.7}
main{flex:1;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tile{background:var(--sf);border:1px solid var(--bd);border-top:5px solid var(--gc);border-radius:16px;padding:18px;cursor:pointer;text-align:left;color:var(--tx);font:inherit}
.tile:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.12)}
.tile .ic{font-size:32px}
.tile b{display:block;font-size:17px;margin:6px 0 2px}
.tile span{color:var(--mu);font-size:13px}
.gh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.gh .ic{font-size:34px}
.gh h2{margin:0;font-size:22px}
.gh p{margin:0;color:var(--mu);font-size:14px}
.card{background:var(--sf);border:1px solid var(--bd);border-left:5px solid var(--gc);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:opacity .2s}
.card.dim{opacity:.3}
.card h3{margin:0;font-size:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card p{margin:4px 0 0;color:var(--mu);font-size:14px}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;color:#fff}
.KH{background:#0ea5e9}.CH{background:#f59e0b}.NV{background:#10b981}.AD{background:#8b5cf6}.HT{background:#64748b}
.det{display:none;margin-top:10px;border-top:1px dashed var(--bd);padding-top:10px;font-size:14px}
.card.open .det{display:block}
.det ol{margin:4px 0 8px;padding-left:20px}
.rule{background:var(--bg);border-radius:8px;padding:8px 10px}
.hint{color:var(--mu);font-size:13px;margin:0 0 14px}
@media (max-width:800px){.wrap{flex-direction:column;padding:0 14px 24px}nav{width:100%;position:static;display:flex;overflow-x:auto}nav button{white-space:nowrap;width:auto}nav .n{display:none}header{padding:16px 14px 8px}}
.fl{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
.fl h3{margin:0 0 2px;font-size:17px}.fl>p{margin:0 0 12px;color:var(--mu);font-size:14px}
.st{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.sp{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;font-size:13px;max-width:215px}
.sp .tag{margin-right:3px}.sp div{margin-top:5px}
.sp i{display:block;font-style:normal;color:var(--ac);font-size:12px;margin-top:5px;font-weight:600}
.ar{align-self:center;color:var(--mu)}
.ent{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px}
.ent h4{margin:0 0 6px;font-size:15px}.ent small{color:var(--mu)}
.fd{display:inline-block;background:var(--bg);border-radius:6px;padding:1px 7px;margin:2px 3px 2px 0;font-size:12px;font-family:ui-monospace,monospace}
.fd.k{font-weight:700;color:var(--ac)}
.rl{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px 18px;margin-top:14px;font-size:14px}
</style>
</head>

["NV","Xử lý sự cố","Đang xử lý, Hoàn thành"],
["KH","Thanh toán phí (nếu có), đánh giá","Đã đóng"],
["AD","Giám sát ca vượt SLA, xử lý khiếu nại",""]]},
{n:"Luồng tài khoản và mở cửa hàng",d:"Nhóm 1, 4, 5 và duyệt ở nhóm 7",s:[
["KH CH","Đăng ký, xác thực OTP","Chưa xác minh"],
["KH CH","Tải CCCD/hộ chiếu, giấy phép lái xe","Chờ duyệt"],
["AD","Duyệt hoặc từ chối kèm lý do","Đã xác minh / Bị từ chối"],
["CH","Đăng ký cửa hàng, tải giấy phép kinh doanh","Chờ duyệt"],

["CH","Thêm xe, đặt giá, thêm nhân viên, phân quyền, phân ca",""]]},
{n:"Luồng tranh chấp tiền cọc",d:"Nhánh phát sinh từ luồng thuê xe, nhóm 3.3 và 7.3",s:[

["HT","Hoàn hoặc trừ cọc theo quyết định, lưu vết","Đã giải quyết"]]}
];
const E=[
["TaiKhoan","id, sdt, email, matKhau, vaiTro, trangThaiXacMinh, trangThai, lyDoKhoa","Nhóm 1, 7"],
["HoSoXacMinh","id, taiKhoanId, anhCCCD, anhGPLX, trangThai, lyDoTuChoi","Nhóm 1"],
["CuaHang","id, chuId, ten, diaChi, sdt, giayPhep, trangThaiDuyet, lyDoTuChoi","Nhóm 4, 7"],
["NhanVien","id, taiKhoanId, cuaHangId, loaiNV, quyen, khuVuc, trangThaiTruc","Nhóm 5, 6"],
["CaLam","id, nhanVienId, ngay, gioBD, gioKT, trangThai","Nhóm 5"],
["Xe","id, cuaHangId, loai, dungTich, namSX, giaNgay, giaTuan, giaThang, trangThai, coDinhVi","Nhóm 2, 4"],
["DonThue","id, khachId, xeId, tgNhan, tgTra, hinhThucNhan, diaChiGiao, tongTien, trangThai","Nhóm 2, 3, 4"],
["ThanhToan","id, donId, loai, phuongThuc, soTien, trangThai","Nhóm 2, 4, 6"],
["TienCoc","id, donId, soTien, trangThai, soTienTru, lyDoTru","Nhóm 2, 3"],
["HopDong","id, donId, noiDung, xacNhanKH, xacNhanCH","Nhóm 3"],
["BienBanBanGiao","id, donId, loai, nhanVienId, kyKH, kyNV, thoiGian","Nhóm 3"],
["KiemTraXe","id, bienBanId, anhVideo, timestamp, soKm, mucNhienLieu, phuKien","Nhóm 3"],
["YeuCauCuuHo","id, donId, loaiSuCo, viTri, moTa, anh, uuTien, nhanVienId, trangThai, mocThoiGian","Nhóm 6, 7"],
["KhuyenMai","id, phamVi, cuaHangId, ma, dieuKien, hanDung, ngansach, luotDung","Nhóm 4, 7"],
["DanhGia","id, donId, doiTuong, diem, noiDung, hienThi","Nhóm 2, 5, 6, 7"],
["KhieuNai","id, donId, nguoiGui, noiDung, bangChung, quyetDinh, adminId","Nhóm 3, 7"],
["ThongBao","id, taiKhoanId, loai, noiDung, daDoc","Nhóm 1"]

const RL=["TaiKhoan 1 - 1 HoSoXacMinh; TaiKhoan (chủ) 1 - N CuaHang","CuaHang 1 - N Xe; CuaHang 1 - N NhanVien; NhanVien 1 - N CaLam","TaiKhoan (khách) 1 - N DonThue; Xe 1 - N DonThue","DonThue 1 - 1 TienCoc, 1 - 1 HopDong, 1 - N ThanhToan, 1 - N BienBanBanGiao","BienBanBanGiao 1 - N KiemTraXe; DonThue 1 - N YeuCauCuuHo, 1 - N KhieuNai, 1 - N DanhGia"];
function flowHTML(){return `<p class="hint">Mỗi ô là một bước: vai trò thực hiện, việc làm và trạng thái sau bước đó.</p>`+F.map((f,k)=>`<div class="fl"><h3>${k+1}. ${f.n}</h3><p>${f.d}</p><div class="st">`+f.s.map((t,j)=>`${j?'<span class="ar">→</span>':''}<div class="sp">${tags(t[0])}<div>${t[1]}</div>${t[2]?`<i>${t[2]}</i>`:''}</div>`).join("")+`</div></div>`).join("")}
function dataHTML(){return `<p class="hint">Thực thể suy ra từ nghiệp vụ trong tài liệu, cần rà lại trước khi chốt thiết kế CSDL. Chữ xanh là khóa chính.</p><div class="grid">`+E.map(e=>`<div class="ent"><h4>${e[0]}</h4>${e[1].split(", ").map((x,i)=>`<span class="fd ${i?'':'k'}">${x}</span>`).join("")}<br><small>${e[2]}</small></div>`).join("")+`</div><div class="rl"><b>Quan hệ chính</b><ul>${RL.map(r=>`<li>${r}</li>`).join("")}</ul></div>`}
const $=s=>document.querySelector(s);
function tags(s){return s.split(" ").map(r=>`<span class="tag ${r}">${R[r]}</span>`).join("")}
function draw(){
  $("#views").innerHTML=[["fn","Menu chức năng"],["flow","Luồng công việc"],["data","Dữ liệu"]].map(([k,t])=>`<button class="chip ${view==k?"on":""}" data-v="${k}">${t}</button>`).join("");
  $("#roles").style.display=$("#nav").style.display=view=="fn"?"":"none";
  if(view=="flow"){$("#main").innerHTML=flowHTML();return}
  if(view=="data"){$("#main").innerHTML=dataHTML();return}
  $("#roles").innerHTML=`<button class="chip ${role?"":"on"}" data-r="">Tất cả vai trò</button>`+Object.keys(R).map(k=>`<button class="chip ${role==k?"on":""}" data-r="${k}">${R[k]}</button>`).join("");
  $("#nav").innerHTML=`<button class="${cur<0?"on":""}" style="--gc:#334155" data-g="-1">🏠 Tổng quan</button>`+G.map((g,k)=>`<button class="${cur==k?"on":""}" style="--gc:${g.c}" data-g="${k}"><span>${g.i}</span>${k+1}. ${g.n}<span class="n">${g.f.length}</span></button>`).join("");
  if(cur<0){
    $("#main").innerHTML=`<p class="hint">Chọn một nhóm chức năng để xem chi tiết. Dùng bộ lọc vai trò phía trên để làm nổi bật chức năng của từng đối tượng.</p><div class="grid">`+G.map((g,k)=>{const m=role?g.f.filter(f=>f[1].includes(role)).length:g.f.length;return `<button class="tile" style="--gc:${g.c}" data-g="${k}"><div class="ic">${g.i}</div><b>${k+1}. ${g.n}</b><span>${m}${role?"/"+g.f.length:""} chức năng con</span></button>`}).join("")+`</div>`;
  }else{
    const g=G[cur];
    $("#main").innerHTML=`<div class="gh"><div class="ic">${g.i}</div><div><h2>${cur+1}. ${g.n}</h2><p>${g.f.length} chức năng con · nhấn vào thẻ để xem thao tác và quy tắc nghiệp vụ · phím ← → để chuyển nhóm</p></div></div>`+g.f.map((f,k)=>`<div class="card ${role&&!f[1].includes(role)?"dim":""}" style="--gc:${g.c}"><h3>${cur+1}.${k+1} ${f[0]} ${tags(f[1])}</h3><p>${f[2]}</p><div class="det"><b>Thao tác chính</b><ol>${f[3].split("|").map(s=>`<li>${s}</li>`).join("")}</ol><div class="rule"><b>Quy tắc:</b> ${f[4]}</div></div></div>`).join("");
  }
}
document.addEventListener("click",e=>{
  const r=e.target.closest("[data-r]"),g=e.target.closest("[data-g]"),c=e.target.closest(".card");
  const v=e.target.closest("[data-v]");if(v){view=v.dataset.v;draw();scrollTo(0,0)}else if(r){role=r.dataset.r;draw()}else if(g){cur=+g.dataset.g;draw();scrollTo(0,0)}else if(c){c.classList.toggle("open")}
});
document.addEventListener("keydown",e=>{if(view!="fn")return;
  if(e.key=="ArrowRight"&&cur<G.length-1){cur++;draw()}
  if(e.key=="ArrowLeft"&&cur>-1){cur--;draw()}
});
draw();
</script>
